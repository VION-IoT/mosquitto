# Publishes the VION broker image to Docker Hub, the same way mesh, dale and hal-raspberry do it:
# from Actions using the repository's own DOCKERHUB_USERNAME / DOCKERHUB_PAT secrets, never from a
# developer machine.
#
# Only VION release tags trigger it. Upstream tags fetched into this fork (v2.1.2, v2.1.1, ...) do
# not match `v*-vion.*` and will never publish anything.
name: vion docker image

on:
  push:
    tags:
      - 'v*-vion.*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to Docker Hub (otherwise build only, to validate the Dockerfile)'
        type: boolean
        default: false

env:
  DOCKERHUB_IMAGE: vioniot/mosquitto
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Secrets cannot be referenced in a step-level `if`, so the presence check is hoisted here.
    # Until DOCKERHUB_PAT exists on this repository the job still builds all three architectures,
    # it just does not publish - a tag push stays green instead of failing on a missing credential.
    env:
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_PAT != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: VION-IoT/shared-workflows/actions/docker-tags@v1
        id: meta
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          release-only: 'true'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.HAVE_DOCKERHUB == 'true' && (github.event_name == 'push' || inputs.push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      # The shared action suppresses :latest for any tag containing a hyphen, treating it as a
      # pre-release. Every VION broker version has one by construction (2.1.2-vion.1), so :latest
      # is added explicitly here, and only ever from a real tag push.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/vion/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.HAVE_DOCKERHUB == 'true' && (github.event_name == 'push' || inputs.push) }}
          provenance: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
          # docker/metadata-action derives labels from the GitHub repository, which for a fork
          # means upstream's description and licenses=NOASSERTION, and those override the
          # Dockerfile's own LABELs. Restate the accurate ones after it; later labels win.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=vioniot/mosquitto
            org.opencontainers.image.description=Eclipse Mosquitto 2.1.2 with four upstream Windows signal fixes backported (517ea607, 4cf0eb29, 8a67d1bb, 24c72a61). Same broker version as the VION Windows gateway.
            org.opencontainers.image.licenses=EPL-2.0 OR BSD-3-Clause
            org.opencontainers.image.vendor=VION IoT
            org.opencontainers.image.url=https://github.com/VION-IoT/mosquitto/releases/tag/v2.1.2-vion.1

      - name: Summary
        run: |
          {
            echo "### vioniot/mosquitto"
            echo ''
            echo "platforms: \`${{ env.PLATFORMS }}\`"
            echo "pushed: \`${{ env.HAVE_DOCKERHUB == 'true' && (github.event_name == 'push' || inputs.push) }}\`"
            if [ "${{ env.HAVE_DOCKERHUB }}" != 'true' ]; then
              echo ''
              echo '> Built but not published: this repository has no DOCKERHUB_USERNAME / DOCKERHUB_PAT secret.'
            fi
            echo ''
            echo 'tags:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
