# Publishes the VION broker image to Docker Hub, the same way mesh, dale and hal-raspberry do it:
# from Actions using the repository's own DOCKERHUB_USERNAME / DOCKERHUB_PAT secrets, never from a
# developer machine.
#
# Only VION release tags trigger it. Upstream tags fetched into this fork (v2.1.2, v2.1.1, ...) do
# not match `v*-vion.*` and will never publish anything.
name: vion docker image

on:
  push:
    tags:
      - 'v*-vion.*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to Docker Hub (otherwise build only, to validate the Dockerfile)'
        type: boolean
        default: false

env:
  DOCKERHUB_IMAGE: vioniot/mosquitto
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: VION-IoT/shared-workflows/actions/docker-tags@v1
        id: meta
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          release-only: 'true'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      # The shared action suppresses :latest for any tag containing a hyphen, treating it as a
      # pre-release. Every VION broker version has one by construction (2.1.2-vion.1), so :latest
      # is added explicitly here, and only ever from a real tag push.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/vion/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          provenance: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          {
            echo "### vioniot/mosquitto"
            echo ''
            echo "platforms: \`${{ env.PLATFORMS }}\`"
            echo "pushed: \`${{ github.event_name == 'push' || inputs.push }}\`"
            echo ''
            echo 'tags:'
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
