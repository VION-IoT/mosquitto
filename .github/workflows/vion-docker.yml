# Publishes the VION broker image to Docker Hub, the same way mesh, dale and hal-raspberry do it:
# from Actions on VION's self-hosted runners, using this repository's DOCKERHUB_USERNAME and
# DOCKERHUB_PAT secrets, never from a developer machine.
#
# amd64 and arm64 build on matching silicon rather than being emulated on one host: amd64 on the
# x64 runners, arm64 natively on the RPi5 runners. Only arm/v7 still needs binfmt, on an x64 host.
# The legs push by digest and a final job assembles the manifest list, which is the only way to
# build a multi-arch image across several machines.
#
# Only VION release tags trigger a publish. Upstream tags fetched into this fork (v2.1.2, v2.1.1,
# ...) do not match `v*-vion.*` and can never publish anything.
name: vion docker image

on:
  push:
    tags:
      - 'v*-vion.*'
  # Dispatch is build-only validation. It deliberately takes no `push` input: on a branch ref the
  # tag set would be empty, so a dispatched publish could only ever produce an untagged manifest or
  # something arbitrary in a public repository. Publishing happens from a `v*-vion.*` tag or not at
  # all.
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: vioniot/mosquitto

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs_on: '["self-hosted", "Linux", "X64"]'
            needs_qemu: false
          - platform: linux/arm64
            runs_on: '["self-hosted", "Linux", "ARM64"]'
            needs_qemu: false
          # arm/v7 emulated on the x64 runners, NOT on the ARM64 ones. 32-bit ARM under
          # qemu-user on an aarch64 host segfaults immediately here - `apk add` dies with
          # exit 139 - which is a well known bad combination with musl. x86_64 -> arm is the
          # well-trodden path and is what the first published build used.
          - platform: linux/arm/v7
            runs_on: '["self-hosted", "Linux", "X64"]'
            needs_qemu: true
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    permissions:
      contents: read
    env:
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_PAT != '' && secrets.DOCKERHUB_USERNAME != '' }}
      DO_PUSH: ${{ (secrets.DOCKERHUB_PAT != '' && secrets.DOCKERHUB_USERNAME != '') && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanitise the platform name for use in a filename
        id: p
        run: echo "slug=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: matrix.needs_qemu

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/vion/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          # Push by digest only. Tags are applied once, by the merge job, across all architectures.
          outputs: ${{ env.DO_PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.DOCKERHUB_IMAGE) || 'type=cacheonly' }}

      - name: Record the digest
        if: env.DO_PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@v4
        if: env.DO_PUSH == 'true'
        with:
          name: digest-${{ steps.p.outputs.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [build]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    env:
      DO_PUSH: ${{ (secrets.DOCKERHUB_PAT != '' && secrets.DOCKERHUB_USERNAME != '') && github.event_name == 'push' }}
    steps:
      - name: Nothing to merge
        if: env.DO_PUSH != 'true'
        run: |
          {
            echo '### vioniot/mosquitto'
            echo ''
            echo '> Built on self-hosted runners but not published: either this repository has no'
            echo '> DOCKERHUB_USERNAME / DOCKERHUB_PAT secret, or the run was dispatched with push=false.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.DO_PUSH == 'true'

      - uses: VION-IoT/shared-workflows/actions/docker-tags@v1
        if: env.DO_PUSH == 'true'
        id: meta
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          release-only: 'true'

      - uses: actions/download-artifact@v4
        if: env.DO_PUSH == 'true'
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
        if: env.DO_PUSH == 'true'

      - name: Login to Docker Hub
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      # The shared action suppresses :latest for any tag containing a hyphen, treating it as a
      # pre-release. Every VION broker version has one by construction (2.1.2-vion.1), so :latest
      # is added explicitly here, and only ever from a real tag push.
      - name: Create the manifest list
        if: env.DO_PUSH == 'true'
        working-directory: /tmp/digests
        run: |
          TAGS=""
          while read -r t; do
            [ -n "$t" ] && TAGS="$TAGS -t $t"
          done <<< "${{ steps.meta.outputs.tags }}"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAGS="$TAGS -t ${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          if [ -z "$TAGS" ]; then
            echo "No tags were computed for ref ${{ github.ref }}; refusing to push an untagged manifest." >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS \
            $(printf '${{ env.DOCKERHUB_IMAGE }}@sha256:%s ' *)

      - name: Summary
        if: env.DO_PUSH == 'true'
        run: |
          {
            echo '### vioniot/mosquitto'
            echo ''
            echo '```'
            docker buildx imagetools inspect "${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
