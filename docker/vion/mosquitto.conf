# Default configuration, present so that `docker run vioniot/mosquitto` works out of the box.
# It matches the upstream eclipse-mosquitto image's default: one anonymous listener on 1883.
#
# VION gateways do NOT use this file. mesh provisions the real configuration - listener with
# mTLS, password_file and acl_file - and it is mounted over /mosquitto/config. Anything running
# on a network you do not control should do the same.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
